<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Регистрация — ТИМдер</title>
  <link rel="stylesheet" href="./colors.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--color-fon, #a5dcc6);
      --surface: #ffffff;
      --text-main: var(--color-5, #126171);
      --text-soft: #335a60;
      --accent: var(--color-4, #409da1);
      --accent-strong: var(--color-5, #126171);
      --success: var(--color-3, #45a994);
      --border: var(--color-1, #95e3c4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--color-1, #95e3c4) 100%);
      color: var(--text-main);
    }

    .app {
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(18, 97, 113, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      flex-shrink: 0;
      margin-left: -10px;
    }

    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--text-soft);
    }

    .card-list {
      display: grid;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .form-label {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-strong);
    }

    .form-hint {
      margin: -4px 0 0;
      font-size: 13px;
      color: var(--text-soft);
      line-height: 1.35;
    }

    .input {
      width: 100%;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-main);
      background: #fff;
      min-height: 96px;
      resize: vertical;
    }

    .input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .input::placeholder {
      color: rgba(51, 90, 96, 0.55);
    }

    .actions-panel {
      margin-top: auto;
      background: #45a994;
      border: 1px solid rgba(18, 97, 113, 0.22);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(18, 97, 113, 0.12);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 10px;
      align-items: stretch;
      min-width: 0;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      min-height: 100%;
      min-width: 0;
    }

    .action-btn--main {
      align-items: center;
      justify-content: center;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #126171;
      border-radius: 12px;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background: #126171;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-btn-img {
      max-width: 100%;
      max-height: 40px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .main-btn {
      flex: 0 0 auto;
      width: 50%;
      max-width: 100%;
      min-width: 0;
      border: none;
      border-radius: 14px;
      padding: 10px 8px;
      font-size: clamp(11px, 2.8vw, 15px);
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
      background: #126171;
      box-shadow: 0 4px 12px rgba(18, 97, 113, 0.2);
      cursor: pointer;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      text-align: center;
      hyphens: auto;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="brand">
        <img
          class="brand-logo"
          src="{{ url_for('static', filename='kartink/logo.png') }}"
          width="44"
          height="44"
          alt=""
          decoding="async"
        />
        <h1 class="title">Регистрация</h1>
      </div>
      <p class="subtitle">Заполните профиль — так проще подобрать команду на хакатон.</p>
    </section>

    <form class="card-list" id="register-form" action="#" method="post" aria-label="Регистрация">
      <article class="card">
        <label class="form-label" for="field-roles">1. Роли</label>
        <p class="form-hint">Кем хотите участвовать: разработчик, дизайнер, аналитик, тимлид и т.д. Можно несколько.</p>
        <textarea
          class="input"
          id="field-roles"
          name="roles"
          rows="4"
          placeholder="Например: Frontend, UI/UX"
          required
        ></textarea>
      </article>

      <article class="card">
        <label class="form-label" for="field-about">2. О себе</label>
        <p class="form-hint">Коротко: опыт, интересы, чем готовы помочь команде.</p>
        <textarea
          class="input"
          id="field-about"
          name="about"
          rows="5"
          placeholder="Расскажите о себе…"
          required
        ></textarea>
      </article>

      <article class="card">
        <label class="form-label" for="field-skills">3. Навыки</label>
        <p class="form-hint">Стек и инструменты через запятую или с новой строки.</p>
        <textarea
          class="input"
          id="field-skills"
          name="skills"
          rows="4"
          placeholder="React, Python, Figma…"
          required
        ></textarea>
      </article>
    </form>

    <section class="actions-panel" aria-label="Действия">
      <div class="actions">
        <div class="action-btn">
          <a class="nav-btn" href="index.html" aria-label="На главную">
            <img class="nav-btn-img" src="kartink/image.png" alt="" decoding="async" />
          </a>
        </div>
        <div class="action-btn action-btn--main">
          <button class="main-btn" type="submit" form="register-form">Сохранить</button>
        </div>
        <div class="action-btn">
          <a class="nav-btn" href="profile.html" aria-label="Личный кабинет">
            <img class="nav-btn-img" src="kartink/image%20(1).png" alt="" decoding="async" />
          </a>
        </div>
      </div>
    </section>
  </main>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
